<div class="auth-container min-h-screen flex items-center justify-center bg-[#faf8f5] p-6 font-['pplxSans',Inter,sans-serif]">
  <div class="auth-card w-full max-w-[400px] bg-white border border-[#d1d1cd] rounded-2xl p-8 shadow-[0_1px_2px_rgba(0,0,0,0.06)]">
    <div class="header text-center mb-6">
      <div class="logo-badge w-9 h-9 rounded-full bg-[#27251e] text-white flex items-center justify-center mx-auto mb-3 shadow-[0_1px_2px_rgba(0,0,0,0.06)]">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
        </svg>
      </div>
      <h1 class="text-lg font-medium text-[#000000] tracking-tight m-0">Welcome Back</h1>
      <p class="subtitle text-xs text-[#72706b] mt-1">Sign in to your AI Agent workspace</p>
    </div>

    @if (errorMessage()) {
      <div class="error-alert flex items-center gap-2 p-3 mb-5 rounded-xl bg-[#faf8f5] border border-[#d1d1cd] text-xs text-[#27251e]">
        <span class="text-sm">⚠️</span>
        <p class="m-0 text-[#72706b]">{{ errorMessage() }}</p>
      </div>
    }

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-4">
      <div class="form-group flex flex-col gap-1.5">
        <label for="email" class="text-[11px] font-medium uppercase tracking-wider text-[#72706b]">Email Address</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="you@example.com"
          class="h-10 w-full px-3.5 bg-white border border-[#d1d1cd] rounded-xl text-sm text-[#27251e] placeholder-[#92918b] focus:outline-none focus:border-[#27251e] focus:ring-1 focus:ring-[#27251e] shadow-[0_1px_2px_rgba(0,0,0,0.04)] transition-all box-border"
          [class.border-red-400]="isFieldInvalid('email')"
          [class.input-error]="isFieldInvalid('email')"
        />
        @if (isFieldInvalid('email')) {
          <span class="field-error text-[11px] text-red-500 mt-0.5">Please enter a valid email address.</span>
        }
      </div>

      <div class="form-group flex flex-col gap-1.5">
        <label for="password" class="text-[11px] font-medium uppercase tracking-wider text-[#72706b]">Password</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          placeholder="••••••••"
          class="h-10 w-full px-3.5 bg-white border border-[#d1d1cd] rounded-xl text-sm text-[#27251e] placeholder-[#92918b] focus:outline-none focus:border-[#27251e] focus:ring-1 focus:ring-[#27251e] shadow-[0_1px_2px_rgba(0,0,0,0.04)] transition-all box-border"
          [class.border-red-400]="isFieldInvalid('password')"
          [class.input-error]="isFieldInvalid('password')"
        />
        @if (isFieldInvalid('password')) {
          <span class="field-error text-[11px] text-red-500 mt-0.5">Password is required.</span>
        }
      </div>

      <button
        type="submit"
        class="submit-btn mt-2 h-10 px-4 w-full rounded-full bg-[#27251e] text-white text-xs font-medium hover:bg-[#000000] active:scale-[0.99] transition-all cursor-pointer shadow-[0_1px_2px_rgba(0,0,0,0.06)] disabled:opacity-40 disabled:cursor-not-allowed flex items-center justify-center gap-2"
        [disabled]="loginForm.invalid || isSubmitting()"
      >
        @if (isSubmitting()) {
          <span class="spinner w-3.5 h-3.5 rounded-full border-2 border-white/40 border-t-white animate-spin"></span>
          <span>Signing in...</span>
        } @else {
          <span>Sign In</span>
        }
      </button>
    </form>

    <div class="footer text-center mt-6 pt-4 border-t border-[#f0eeea]">
      <p class="text-xs text-[#72706b] m-0">Don't have an account? <a routerLink="/register" class="text-[#016a71] font-medium hover:underline">Create one</a></p>
    </div>
  </div>
</div>
