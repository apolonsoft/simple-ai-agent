<div class="admin-wrapper flex flex-col min-h-screen w-full bg-[#faf8f5] text-[#27251e] font-['pplxSans',Inter,sans-serif]">
  <!-- Admin Top Bar -->
  <header class="admin-header h-14 min-h-14 bg-white border-b border-[#d1d1cd] flex items-center justify-between px-4 sm:px-8 shrink-0 z-20 shadow-2xs">
    <div class="flex items-center gap-3">
      <div class="w-7 h-7 rounded-full bg-[#016a71] text-white flex items-center justify-center text-xs font-semibold shadow-xs">
        <span>🛡️</span>
      </div>
      <div class="flex items-center gap-2">
        <span class="text-sm font-semibold text-[#000000] tracking-tight">Admin Console</span>
        <span class="text-[10px] uppercase font-bold tracking-wider px-2 py-0.5 rounded-full bg-[#eef7f7] text-[#016a71] border border-[#b2dddf]">
          Management
        </span>
      </div>
    </div>

    <div class="flex items-center gap-3">
      @if (currentUser(); as user) {
        <div class="hidden sm:flex items-center gap-2 px-2.5 py-1 rounded-full bg-[#faf8f5] border border-[#d1d1cd] text-xs text-[#72706b]">
          <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
          <span class="font-medium text-[#27251e]">{{ user.full_name || user.email }}</span>
          <span class="text-[10px] uppercase font-mono px-1 rounded bg-white border border-[#d1d1cd] text-[#016a71]">
            {{ user.role }}
          </span>
        </div>
      }

      <a
        routerLink="/chat"
        class="btn-back-chat h-8 px-3.5 rounded-full bg-white border border-[#d1d1cd] text-xs font-medium text-[#27251e] hover:bg-[#e8e6e1] transition-colors flex items-center gap-1.5 shadow-[0_1px_2px_rgba(0,0,0,0.04)] cursor-pointer"
        title="Return to Chat"
      >
        <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        <span>Back to Chat</span>
      </a>
    </div>
  </header>

  <!-- Admin Viewport Content -->
  <main class="flex-1 w-full max-w-7xl mx-auto p-4 sm:p-8">
    <router-outlet></router-outlet>
  </main>
</div>
