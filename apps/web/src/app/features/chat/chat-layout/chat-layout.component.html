<div class="layout-wrapper flex flex-col h-screen w-screen bg-[#faf8f5] text-[#27251e] overflow-hidden fixed inset-0 font-['pplxSans',Inter,sans-serif]">
  <!-- Top Navigation Bar: 56px height, hairline bottom border -->
  <header class="top-nav h-14 min-h-14 bg-[#faf8f5] border-b border-[#d1d1cd] flex items-center justify-between px-5 shrink-0 z-20">
    <div class="brand flex items-center gap-2.5">
      <div class="w-7 h-7 rounded-full bg-[#27251e] text-white flex items-center justify-center text-xs font-medium">
        <span class="brand-icon">⚡</span>
      </div>
      <span class="brand-title text-sm font-medium tracking-tight text-[#000000]">Enterprise AI Agent</span>
      <span class="status-badge text-[11px] font-medium text-[#016a71] bg-[#016a71]/10 px-2 py-0.5 rounded-full border border-[#016a71]/20">Online</span>
    </div>

    <div class="user-actions flex items-center gap-3">
      @if (isAdminOrSuperAdmin()) {
        <a
          routerLink="/admin/users"
          class="admin-nav-pill h-7 px-3 rounded-full bg-white border border-[#b2dddf] text-[#016a71] hover:bg-[#eef7f7] text-xs font-semibold flex items-center gap-1.5 shadow-[0_1px_2px_rgba(0,0,0,0.04)] transition-all cursor-pointer select-none"
          title="Open Admin Console"
        >
          <span class="text-xs">🛡️</span>
          <span>Admin</span>
        </a>
      }

      @if (currentUser(); as user) {
        <a
          routerLink="/profile"
          class="user-chip h-7 pl-1 pr-3 rounded-full bg-white border border-[#d1d1cd] hover:border-[#27251e] hover:bg-[#e8e6e1] flex items-center gap-2 shadow-[0_1px_2px_rgba(0,0,0,0.04)] transition-all cursor-pointer select-none"
          title="View account profile"
        >
          @if (user.avatar_url) {
            <img
              [src]="user.avatar_url"
              alt="Avatar"
              class="w-5 h-5 rounded-full object-cover shrink-0"
            />
          } @else {
            <span class="user-avatar w-5 h-5 rounded-full bg-[#27251e] text-white flex items-center justify-center text-[10px] font-medium shrink-0">
              {{ (user.full_name?.[0] || user.email[0]).toUpperCase() }}
            </span>
          }
          <span class="user-email text-xs text-[#27251e] max-w-[160px] truncate">{{ user.full_name || user.email }}</span>
        </a>
      }

      <button
        class="logout-btn h-7 px-3 rounded-full bg-white border border-[#d1d1cd] text-xs font-normal text-[#72706b] hover:text-[#27251e] hover:bg-[#e8e6e1] flex items-center gap-1.5 transition-colors shadow-[0_1px_2px_rgba(0,0,0,0.04)] cursor-pointer"
        (click)="onLogout()"
        title="Sign out"
      >
        <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        <span>Sign Out</span>
      </button>
    </div>
  </header>

  <!-- Main Layout Body: Sidebar (220px) + Centered Dynamic Chat Viewport -->
  <div class="layout-body flex flex-1 overflow-hidden bg-[#faf8f5]">
    <app-chat-sidebar class="shrink-0"></app-chat-sidebar>
    <main class="chat-viewport flex-1 overflow-hidden relative bg-[#faf8f5]">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
